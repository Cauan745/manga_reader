services:
  postgres:
    image: postgres:15-alpine
    container_name: manga_reader_db 
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manga_reader_db
    ports:
      - "5432:5432"
    volumes:
        - ./internal/adapters/postgresql/schema/:/docker-entrypoint-initdb.d
      #- postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
